apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sit-project-c
  namespace: argocd
spec:
  project: demo-platform
  sources:
    - repoURL: https://github.com/MohamedHamdy404/gitops-demo-project-c.git
      path: postgresql
      targetRevision: main
      helm:
        valueFiles:
          - $values/values/project-c/sit-values.yaml
    - repoURL: https://github.com/MohamedHamdy404/gitops-demo-argocd-gitops.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: sit-project-c
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
