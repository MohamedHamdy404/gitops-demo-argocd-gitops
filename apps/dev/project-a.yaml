apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dev-project-a
  namespace: argocd
spec:
  project: demo-platform
  sources:
  - repoURL: https://github.com/MohamedHamdy404/gitops-demo-project-a.git
    path: nginx
    targetRevision: 15.4.4
    helm:
      valueFiles:
      - $values/values/project-a/dev-values.yaml
  - repoURL: https://github.com/MohamedHamdy404/gitops-demo-argocd-gitops.git
    targetRevision: HEAD
    ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: dev-project-a
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
